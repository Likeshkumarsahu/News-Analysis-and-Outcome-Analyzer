[project]
name = "news-analysis-and-outcome-analyzer-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "feedparser>=6.0.12",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "google-genai>=2.13.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "lime>=0.2.0.1",
    "litellm>=1.95.0",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "openai>=2.46.0",
    "pip>=26.1.2",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8.13",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
